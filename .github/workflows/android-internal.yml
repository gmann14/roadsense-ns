name: Android internal track (manual)

# Twin of `ios-testflight.yml`: builds a signed AAB for the
# `production` flavor and (when ANDROID_PUBLISH_ENABLED=true) uploads it to
# Google Play Console's Internal Testing track.
#
# This workflow only runs on `workflow_dispatch` so accidental pushes never
# burn an AAB version. Promoting from Internal → Closed Testing → Production
# is still manual via the Play Console (per docs/implementation/15-google-play-readiness.md).
#
# Secrets live in the `android-internal` GitHub Environment (all required;
# the run fails before building if any is missing):
#   ANDROID_UPLOAD_KEYSTORE          base64-encoded contents of the .jks
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD store password
#   ANDROID_UPLOAD_KEY_ALIAS         key alias inside the store
#   ANDROID_UPLOAD_KEY_PASSWORD      key password
#   MAPBOX_ACCESS_TOKEN              public mapbox pk.* token
#   SUPABASE_ANON_KEY_PRODUCTION     production anon key for the production flavor
#   GOOGLE_PLAY_JSON_KEY             Play Developer API service-account JSON
#                                    (required only when publishing)
#
# Optional repo or environment variable:
#   ANDROID_PUBLISH_ENABLED          set to "true" to actually upload the AAB

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes for this Internal Testing release"
        required: false
        default: "Internal testing build"

concurrency:
  group: android-internal-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: android-internal
    env:
      ANDROID_PUBLISH_ENABLED: ${{ vars.ANDROID_PUBLISH_ENABLED }}
    steps:
      - name: Check required release secrets
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          SUPABASE_ANON_KEY_PRODUCTION: ${{ secrets.SUPABASE_ANON_KEY_PRODUCTION }}
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        shell: bash
        run: |
          missing=()
          for name in ANDROID_UPLOAD_KEYSTORE ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD MAPBOX_ACCESS_TOKEN SUPABASE_ANON_KEY_PRODUCTION; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ "${ANDROID_PUBLISH_ENABLED}" == "true" && -z "${GOOGLE_PLAY_JSON_KEY}" ]]; then
            missing+=("GOOGLE_PLAY_JSON_KEY")
          fi
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required secret(s) in the android-internal environment: ${missing[*]}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keystores"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/keystores/upload-key.jks"
          chmod 600 "$RUNNER_TEMP/keystores/upload-key.jks"
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/keystores/upload-key.jks" >> "$GITHUB_ENV"

      - name: Write production secrets
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY_PRODUCTION }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
            echo "MAPBOX_ACCESS_TOKEN=$MAPBOX_TOKEN"
            echo "SUPABASE_ANON_KEY=$SUPABASE_KEY"
          } > android/config/production.env.secrets.properties

      - name: Run Android JVM tests
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew test

      - name: Bundle production release AAB
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew :app:bundleProductionRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roadsense-production-release-aab
          path: android/app/build/outputs/bundle/productionRelease/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Google Play Internal Testing
        if: ${{ env.ANDROID_PUBLISH_ENABLED == 'true' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          packageName: ca.roadsense.android
          releaseFiles: android/app/build/outputs/bundle/productionRelease/*.aab
          track: internal
          status: completed
          whatsNewDirectory: android/distribution/whatsnew
