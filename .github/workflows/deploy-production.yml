name: Deploy Production

# Manual production deploy of the database migrations and the Railway API
# service. The Cloudflare Worker proxy, the web app and the mobile apps are
# deployed separately; the full order and the manual commands are in
# docs/implementation/05-deployment-and-observability.md ("Production deploy").
#
# Order inside this workflow:
#   1. Check inputs, secrets and variables (nothing is changed before this).
#   2. Refuse to run if the migration ledger is empty (baseline it first).
#   3. Report readings partitions the next nightly drop will remove.
#   4. supabase db push --dry-run, then supabase db push.
#   5. Set GIT_COMMIT_SHA on the Railway service, then railway up.
#   6. Wait until /health reports this commit, then run scripts/api-smoke.sh.
#
# Environment `production` (add required reviewers):
#   secrets  DATABASE_URL     Postgres URL of the production database
#            RAILWAY_TOKEN    Railway project token for the production environment
#            PUBLIC_API_KEY   public API key the apps send as `apikey`
#   vars     FUNCTIONS_BASE_URL  default https://api.nsroadsense.ca/functions/v1
#            RAILWAY_SERVICE     default api
#
# Never runs scripts/seeded-e2e-smoke.sh: it writes public data.

on:
  workflow_dispatch:
    inputs:
      db_snapshot_taken:
        description: I took a Railway database backup/snapshot in the last hour
        required: true
        type: boolean
        default: false
      worker_deployed_first:
        description: The Cloudflare Worker for this commit is already deployed (wrangler deploy)
        required: true
        type: boolean
        default: false
      allow_partition_drop:
        description: Rows in readings partitions older than 6 months may be dropped
        required: true
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.95.4
  RAILWAY_CLI_VERSION: 4.59.0

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      FUNCTIONS_BASE_URL: ${{ vars.FUNCTIONS_BASE_URL || 'https://api.nsroadsense.ca/functions/v1' }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || 'api' }}
      RAILWAY_ENVIRONMENT: production
      DB_SNAPSHOT_TAKEN: ${{ inputs.db_snapshot_taken }}
      WORKER_DEPLOYED_FIRST: ${{ inputs.worker_deployed_first }}
      ALLOW_PARTITION_DROP: ${{ inputs.allow_partition_drop }}
    steps:
      - name: Check inputs, secrets and variables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
        shell: bash
        run: |
          errors=()
          for name in DATABASE_URL RAILWAY_TOKEN PUBLIC_API_KEY; do
            if [[ -z "${!name}" ]]; then
              errors+=("secret ${name} is not set in the production environment")
            fi
          done
          if [[ "${DB_SNAPSHOT_TAKEN}" != "true" ]]; then
            errors+=("take a database backup first, then tick db_snapshot_taken")
          fi
          if [[ "${WORKER_DEPLOYED_FIRST}" != "true" ]]; then
            errors+=("deploy the Cloudflare Worker first, then tick worker_deployed_first")
          fi
          if [[ "${FUNCTIONS_BASE_URL}" != https://* ]]; then
            errors+=("FUNCTIONS_BASE_URL must be an https URL")
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            errors+=("production deploys run from main only (got ${GITHUB_REF})")
          fi
          if (( ${#errors[@]} > 0 )); then
            for e in "${errors[@]}"; do echo "::error::${e}"; done
            exit 1
          fi
          echo "Deploying ${GITHUB_SHA} to ${RAILWAY_SERVICE} (${RAILWAY_ENVIRONMENT}); API ${FUNCTIONS_BASE_URL}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install postgres client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Refuse an empty migration ledger
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/pg-env.sh
          roadsense_pg_env_from_database_url
          ledger="$(psql -X -At -v ON_ERROR_STOP=1 -c "select to_regclass('supabase_migrations.schema_migrations') is not null")"
          if [[ "${ledger}" != "t" ]]; then
            echo "::error::supabase_migrations.schema_migrations does not exist. supabase db push would replay every migration. Baseline the ledger first (doc 05, 'Migration ledger baseline')."
            exit 1
          fi
          applied="$(psql -X -At -v ON_ERROR_STOP=1 -c "select count(*) from supabase_migrations.schema_migrations")"
          latest="$(psql -X -At -v ON_ERROR_STOP=1 -c "select coalesce(max(version), 'none') from supabase_migrations.schema_migrations")"
          if [[ "${applied}" == "0" ]]; then
            echo "::error::The migration ledger is empty. Baseline it first (doc 05, 'Migration ledger baseline')."
            exit 1
          fi
          echo "Ledger has ${applied} migration(s); latest ${latest}"

      - name: Report readings partitions the next drop removes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ALLOW_PARTITION_DROP}" == "true" ]]; then
            scripts/report-expiring-partitions.sh
          else
            scripts/report-expiring-partitions.sh --fail-if-rows || {
              status=$?
              if [[ "${status}" == "3" ]]; then
                echo "::error::Expiring partitions still hold rows. Export them or re-run with allow_partition_drop ticked."
              fi
              exit "${status}"
            }
          fi

      - name: Preview database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: supabase db push --db-url "${DATABASE_URL}" --dry-run

      - name: Push database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: supabase db push --db-url "${DATABASE_URL}" --yes

      - name: Install Railway CLI
        shell: bash
        run: npm install -g "@railway/cli@${RAILWAY_CLI_VERSION}"

      - name: Deploy the API to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # /health reports GIT_COMMIT_SHA (GIT_SHA for older builds); railway up
          # uploads a tarball, so Railway does not set RAILWAY_GIT_COMMIT_SHA.
          railway variable set "GIT_COMMIT_SHA=${GITHUB_SHA}" "GIT_SHA=${GITHUB_SHA}" \
            --service "${RAILWAY_SERVICE}" --environment "${RAILWAY_ENVIRONMENT}" --skip-deploys
          railway up --service "${RAILWAY_SERVICE}" --environment "${RAILWAY_ENVIRONMENT}" \
            --ci --message "deploy-production ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"

      - name: Wait for the new deployment
        env:
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
        shell: bash
        run: scripts/wait-for-deploy.sh "${GITHUB_SHA}" 900

      - name: Run production API smoke
        env:
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: scripts/api-smoke.sh
