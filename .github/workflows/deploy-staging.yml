name: Deploy Staging

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      RAILWAY_DEPLOY_HOOK_URL: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}
      FUNCTIONS_BASE_URL: ${{ vars.FUNCTIONS_BASE_URL }}
      FUNCTIONS_BASE_URL_SECRET: ${{ secrets.FUNCTIONS_BASE_URL }}
      PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required staging secrets
        id: precheck
        shell: bash
        run: |
          if [[ -z "${DATABASE_URL}" && -z "${RAILWAY_DATABASE_URL}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Staging database deploy is not configured yet; set DATABASE_URL or RAILWAY_DATABASE_URL."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install postgres client
        if: steps.precheck.outputs.ready == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Set up Supabase CLI
        if: steps.precheck.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.95.4

      - name: Set up Deno
        if: steps.precheck.outputs.ready == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Push database migrations
        if: steps.precheck.outputs.ready == 'true'
        shell: bash
        run: |
          db_url="${DATABASE_URL:-${RAILWAY_DATABASE_URL}}"
          supabase db push --db-url "${db_url}"

      - name: Trigger Railway API deploy
        if: steps.precheck.outputs.ready == 'true' && env.RAILWAY_DEPLOY_HOOK_URL != ''
        shell: bash
        run: curl -fsS -X POST "${RAILWAY_DEPLOY_HOOK_URL}"

      - name: Warn if Railway deploy hook is missing
        if: steps.precheck.outputs.ready == 'true' && env.RAILWAY_DEPLOY_HOOK_URL == ''
        run: echo "::warning::RAILWAY_DEPLOY_HOOK_URL is not set; database migrations ran but API deploy was skipped."

      - name: Run staging smoke checks
        if: steps.precheck.outputs.ready == 'true'
        shell: bash
        run: |
          export DATABASE_URL="${DATABASE_URL:-${RAILWAY_DATABASE_URL}}"
          export FUNCTIONS_BASE_URL="${FUNCTIONS_BASE_URL:-${FUNCTIONS_BASE_URL_SECRET}}"
          export SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-${PUBLIC_API_KEY}}"
          if [[ -z "${FUNCTIONS_BASE_URL}" || -z "${SUPABASE_ANON_KEY}" ]]; then
            echo "::warning::Smoke checks skipped; set FUNCTIONS_BASE_URL and PUBLIC_API_KEY or SUPABASE_ANON_KEY."
            exit 0
          fi
          bash -n ./scripts/api-smoke.sh
          bash -n ./scripts/seeded-e2e-smoke.sh
          ./scripts/api-smoke.sh
          ./scripts/seeded-e2e-smoke.sh
