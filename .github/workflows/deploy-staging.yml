name: Deploy Staging

# Same steps as deploy-production.yml against a separate staging Railway
# environment. There is no staging environment yet; this workflow refuses to
# run until the `staging` GitHub Environment points at one, and refuses any
# FUNCTIONS_BASE_URL or database that belongs to production.
#
# Environment `staging`:
#   secrets  DATABASE_URL     Postgres URL of the staging database
#            RAILWAY_TOKEN    Railway project token for the staging environment
#            PUBLIC_API_KEY   staging public API key
#   vars     FUNCTIONS_BASE_URL  staging API base, e.g. https://<staging-host>/functions/v1 (required)
#            RAILWAY_SERVICE     default api
#            RAILWAY_ENVIRONMENT default staging

on:
  workflow_dispatch:
    inputs:
      run_seeded_smoke:
        description: Also run scripts/seeded-e2e-smoke.sh (writes and then deletes synthetic data)
        required: true
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.95.4
  RAILWAY_CLI_VERSION: 4.59.0

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging
    env:
      FUNCTIONS_BASE_URL: ${{ vars.FUNCTIONS_BASE_URL }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || 'api' }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'staging' }}
      RUN_SEEDED_SMOKE: ${{ inputs.run_seeded_smoke }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check secrets, variables and targets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
        shell: bash
        run: |
          set -uo pipefail
          errors=()
          for name in DATABASE_URL RAILWAY_TOKEN PUBLIC_API_KEY FUNCTIONS_BASE_URL; do
            if [[ -z "${!name:-}" ]]; then
              errors+=("${name} is not set in the staging environment")
            fi
          done
          if [[ "${RAILWAY_ENVIRONMENT}" == "production" ]]; then
            errors+=("RAILWAY_ENVIRONMENT must not be production")
          fi
          source scripts/lib/pg-env.sh
          if [[ -n "${FUNCTIONS_BASE_URL:-}" ]] && roadsense_is_production_api_url "${FUNCTIONS_BASE_URL}"; then
            errors+=("FUNCTIONS_BASE_URL points at production")
          fi
          if [[ -n "${DATABASE_URL:-}" ]]; then
            roadsense_pg_env_from_database_url
            if [[ "${ROADSENSE_DB_HOST}" == "postgis.railway.internal" ]]; then
              errors+=("DATABASE_URL uses a Railway private host the runner cannot reach")
            fi
          fi
          if (( ${#errors[@]} > 0 )); then
            for e in "${errors[@]}"; do echo "::error::${e}"; done
            exit 1
          fi
          echo "Deploying ${GITHUB_SHA} to ${RAILWAY_SERVICE} (${RAILWAY_ENVIRONMENT}); API ${FUNCTIONS_BASE_URL}"

      - name: Install postgres client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Preview database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: supabase db push --db-url "${DATABASE_URL}" --dry-run

      - name: Push database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: supabase db push --db-url "${DATABASE_URL}" --yes

      - name: Install Railway CLI
        shell: bash
        run: npm install -g "@railway/cli@${RAILWAY_CLI_VERSION}"

      - name: Deploy the API to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          railway variable set "GIT_COMMIT_SHA=${GITHUB_SHA}" "GIT_SHA=${GITHUB_SHA}" \
            --service "${RAILWAY_SERVICE}" --environment "${RAILWAY_ENVIRONMENT}" --skip-deploys
          railway up --service "${RAILWAY_SERVICE}" --environment "${RAILWAY_ENVIRONMENT}" \
            --ci --message "deploy-staging ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"

      - name: Wait for the new deployment
        env:
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
        shell: bash
        run: scripts/wait-for-deploy.sh "${GITHUB_SHA}" 900

      - name: Run staging API smoke
        env:
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: scripts/api-smoke.sh

      - name: Run seeded end-to-end smoke
        if: ${{ env.RUN_SEEDED_SMOKE == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
        shell: bash
        run: scripts/seeded-e2e-smoke.sh --allow-remote-non-production
