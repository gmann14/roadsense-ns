name: Production health monitor

# Every 30 minutes: GET /functions/v1/health/deep on production and fail the
# run (GitHub emails the workflow's last editor / repo watchers on failure)
# unless it answers {"status":"ok","db":"reachable"}.
#
# Repository secret (Settings → Secrets and variables → Actions):
#   HEALTH_CHECK_API_KEY   the public API key sent as `apikey`
# Optional repository variable:
#   HEALTH_CHECK_URL       default https://api.nsroadsense.ca/functions/v1/health/deep
#
# Scheduled workflows only run on the default branch and GitHub pauses them
# after 60 days without repository activity.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: health-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deep-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HEALTH_CHECK_URL: ${{ vars.HEALTH_CHECK_URL || 'https://api.nsroadsense.ca/functions/v1/health/deep' }}
      HEALTH_CHECK_API_KEY: ${{ secrets.HEALTH_CHECK_API_KEY }}
    steps:
      - name: Check /health/deep
        shell: bash
        run: |
          set -uo pipefail
          if [[ -z "${HEALTH_CHECK_API_KEY}" ]]; then
            echo "::error::Repository secret HEALTH_CHECK_API_KEY is not set."
            exit 1
          fi
          body="$(mktemp)"
          for attempt in 1 2 3; do
            code="$(curl -sS -o "${body}" -w '%{http_code}' --max-time 20 \
              -H "apikey: ${HEALTH_CHECK_API_KEY}" \
              -H "Authorization: Bearer ${HEALTH_CHECK_API_KEY}" \
              "${HEALTH_CHECK_URL}")" || code="000"
            if [[ "${code}" == "200" ]] && jq -e '.status == "ok" and .db == "reachable"' "${body}" >/dev/null 2>&1; then
              echo "Healthy (attempt ${attempt}): $(jq -c '{status, db, commit, deployed_at}' "${body}")"
              exit 0
            fi
            echo "::warning::Attempt ${attempt}: HTTP ${code}: $(head -c 300 "${body}")"
            if [[ "${attempt}" != "3" ]]; then
              sleep 20
            fi
          done
          echo "::error::${HEALTH_CHECK_URL} is unhealthy after 3 attempts."
          exit 1
