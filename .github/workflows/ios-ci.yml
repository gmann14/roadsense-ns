name: iOS CI

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift-package:
    name: Swift package tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Swift version
        run: xcrun swift --version

      - name: Run bootstrap Swift tests
        working-directory: ios
        run: xcrun swift test

  # Full simulator suite: on demand only, to conserve macOS minutes.
  simulator:
    name: Xcode simulator test suite
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify iOS scaffold exists
        shell: bash
        run: |
          test -d ios
          test -f ios/README.md
          test -f ios/Package.swift
          test -f ios/project.yml
          test -f ios/Config/RoadSenseNS.Local.xcconfig
          test -f ios/Config/RoadSenseNS.Staging.xcconfig
          test -f ios/Config/RoadSenseNS.Production.xcconfig
          test -d ios/Sources/RoadSenseNSBootstrap
          test -d ios/RoadSenseNS
          test -d ios/Config/Templates

      - name: Install XcodeGen
        shell: bash
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Run full simulator test suite
        working-directory: ios
        run: |
          xcodebuild test \
            -project RoadSenseNS.xcodeproj \
            -scheme RoadSenseNS \
            -configuration "Local Debug" \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_PREVIEWS=NO
