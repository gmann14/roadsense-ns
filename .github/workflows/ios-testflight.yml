name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Release configuration to archive
        required: true
        type: choice
        default: Staging Release
        options:
          - Staging Release
          - Production Release
      build_number:
        description: Optional CFBundleVersion override
        required: false
        type: string
      upload_to_testflight:
        description: Upload the signed IPA to internal TestFlight
        required: true
        type: boolean
        default: true

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      APPLE_ASC_API_KEY_ID: ${{ secrets.APPLE_ASC_API_KEY_ID }}
      APPLE_ASC_API_ISSUER_ID: ${{ secrets.APPLE_ASC_API_ISSUER_ID }}
      APPLE_ASC_API_PRIVATE_KEY: ${{ secrets.APPLE_ASC_API_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 || secrets.APPLE_DISTRIBUTION_SECRET_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
      ROAD_SENSE_PUBLIC_API_KEY: ${{ secrets.ROAD_SENSE_PUBLIC_API_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      ENABLE_POTHOLE_PHOTOS: "YES"
      ROAD_SENSE_APP_IDENTIFIER: ca.roadsense.ios
      IOS_RELEASE_CONFIGURATION: ${{ inputs.configuration }}
      IOS_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
      SKIP_TESTFLIGHT_UPLOAD: ${{ inputs.upload_to_testflight == false && '1' || '0' }}
      TESTFLIGHT_CHANGELOG: Internal RoadSense NS field-test build from ${{ github.sha }}.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required release secrets
        shell: bash
        run: |
          missing=()
          for name in APPLE_ASC_API_KEY_ID APPLE_ASC_API_ISSUER_ID APPLE_ASC_API_PRIVATE_KEY APPLE_TEAM_ID APPLE_DISTRIBUTION_CERTIFICATE_BASE64 APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64 MAPBOX_ACCESS_TOKEN ROAD_SENSE_PUBLIC_API_KEY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install XcodeGen
        shell: bash
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Show Xcode version
        shell: bash
        run: xcodebuild -version

      - name: Write App Store Connect private key
        shell: bash
        run: |
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_ASC_API_KEY_ID}.p8"
          printf '%s' "${APPLE_ASC_API_PRIVATE_KEY}" > "${key_path}"
          chmod 600 "${key_path}"
          echo "APPLE_ASC_API_PRIVATE_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"

      - name: Install Apple signing assets
        shell: bash
        env:
          SIGNING_KEYCHAIN_PASSWORD: ${{ runner.temp }}-${{ github.run_id }}
        run: |
          keychain_path="${RUNNER_TEMP}/roadsense-signing.keychain-db"
          certificate_path="${RUNNER_TEMP}/distribution.p12"
          profile_path="${RUNNER_TEMP}/app-store.mobileprovision"
          profile_plist_path="${RUNNER_TEMP}/app-store-profile.plist"
          profiles_dir="${HOME}/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "${APPLE_DISTRIBUTION_CERTIFICATE_BASE64}" | base64 --decode > "${certificate_path}" \
            || printf '%s' "${APPLE_DISTRIBUTION_CERTIFICATE_BASE64}" | base64 -D > "${certificate_path}"
          printf '%s' "${APPLE_PROVISIONING_PROFILE_BASE64}" | base64 --decode > "${profile_path}" \
            || printf '%s' "${APPLE_PROVISIONING_PROFILE_BASE64}" | base64 -D > "${profile_path}"

          security create-keychain -p "${SIGNING_KEYCHAIN_PASSWORD}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${SIGNING_KEYCHAIN_PASSWORD}" "${keychain_path}"
          security import "${certificate_path}" \
            -P "${APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" "${HOME}/Library/Keychains/login.keychain-db"
          security default-keychain -s "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${SIGNING_KEYCHAIN_PASSWORD}" "${keychain_path}"

          security cms -D -i "${profile_path}" > "${profile_plist_path}"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "${profile_plist_path}")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print Name' "${profile_plist_path}")"
          mkdir -p "${profiles_dir}"
          cp "${profile_path}" "${profiles_dir}/${profile_uuid}.mobileprovision"

          echo "Installed provisioning profile: ${profile_name}"
          echo "ROAD_SENSE_APP_PROFILE_SPECIFIER=${profile_name}" >> "${GITHUB_ENV}"

      - name: Build and upload internal TestFlight build
        shell: bash
        run: |
          cd ios
          bundle exec fastlane ios internal_testflight

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roadsense-ios-ipa
          path: ios/build/ipas/*.ipa
          if-no-files-found: ignore

      - name: Upload archive logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roadsense-ios-build-logs
          path: |
            ios/build
            ~/Library/Logs/gym
          if-no-files-found: ignore
