# Mirror of ios/Config/RoadSenseNS.Production.xcconfig.
# Real values land in production.env.secrets.properties at release time, never
# committed — same posture as iOS.
APP_ENV=PRODUCTION
APP_DISPLAY_NAME=RoadSense NS
# Cloudflare proxy in front of the Railway gateway. The app appends
# /functions/v1 (AppConfig.functionsBaseURL), exactly like iOS.
API_BASE_URL=https://api.nsroadsense.ca
MAPBOX_ACCESS_TOKEN=pk.placeholder.production
SUPABASE_ANON_KEY=anon.placeholder.production
SENTRY_DSN=
# Photo uploads stay off until the backend photo flow ships: the production
# gateway answers /pothole-photos with 503 photos_disabled, and there is no
# capture UI. Flip together with the server and iOS ENABLE_POTHOLE_PHOTOS.
ENABLE_POTHOLE_PHOTOS=false
