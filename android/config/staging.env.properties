# Mirror of ios/Config/RoadSenseNS.Staging.xcconfig — including the same
# committed Supabase anon key (anon keys are designed to be public; row-level
# security is what protects writes). MAPBOX_ACCESS_TOKEN is a placeholder
# here — override in staging.env.secrets.properties locally.
APP_ENV=STAGING
APP_DISPLAY_NAME=RoadSense NS
# There is no separate staging backend yet, so — like the iOS staging
# xcconfig — this goes through the Cloudflare proxy host. Never point a build
# at the raw Railway origin: the proxy is what applies the edge rate limits.
API_BASE_URL=https://api.nsroadsense.ca
MAPBOX_ACCESS_TOKEN=pk.placeholder.staging
SUPABASE_ANON_KEY=hwJJrdunK0YQVGIBYzV6LUfosME9ZN9cg7AbE0PJgyYM69eb
SENTRY_DSN=
ENABLE_POTHOLE_PHOTOS=false
